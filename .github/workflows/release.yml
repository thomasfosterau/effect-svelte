name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-svelte' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "*"
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "*"
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the version PR
        id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      # Changesets has no assignee setting, so the PR it opens (as
      # github-actions[bot]) is assigned here; `pr-number` is the action's
      # output for the PR it created or updated. The REST assignees endpoint
      # accepts `pull-requests: write` for a pull request, so the job needs no
      # `issues: write` (which `gh pr edit --add-assignee` would).
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/assignees" -f "assignees[]=thomasfosterau" --silent

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    # Never for a Dependabot-triggered run either: this job holds
    # `id-token: write` and `contents: write`.
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That would run the root `prepare` and every `allowBuilds`
      # dependency's build script inside this job, which holds
      # `id-token: write`. It triggers whenever a manifest's mtime moves after
      # the install step, e.g. when the Changesets action checks out an
      # existing `changeset-release/trunk` and `git reset --hard`s it back
      # before `pnpm run version`. Scoped to this job: CI and local runs keep
      # the default. pnpm 11 reads only the `pnpm_config_*` spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Vite+ at the catalog's pin, with the Node.js and pnpm it manages: the
      # latest STABLE Node (`*` is a semver range, so never a pre-release; see
      # .github/actions/setup/action.yml) and the pnpm that package.json's
      # `packageManager` pins. `run-install: false`: the install is the step
      # below, with `--ignore-scripts`. No `registry-url`: it would write an
      # `.npmrc` with a placeholder `_authToken` and point pnpm at it
      # (`PNPM_CONFIG_USERCONFIG`); publishing is OIDC, with no token, against
      # pnpm's default registry (registry.npmjs.org).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "*"
          cache: true
          run-install: false

      # No npm upgrade: pnpm 11 publishes natively (libnpmpublish; it no
      # longer shells out to `npm publish`) and performs the OIDC trusted
      # publishing exchange itself, so the npm bundled with Node is never on
      # the publish path. See PUBLISHING.md.

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It also
      # skips this workspace's own `prepare` (the Vite+ git hooks), which the
      # `vp pack` build does not need. It only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see the job
      # `env` above); otherwise a later `pnpm run` could re-install with
      # scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # When changesets are pending, this opens/updates the version PR (via
      # `pnpm run version`). Once that PR is merged (no changesets remain), it
      # runs `pnpm run release`, which builds every package, publishes each
      # bumped one with `pnpm publish --ignore-scripts` (pnpm's own OIDC
      # trusted publishing — there is no NPM_TOKEN to steal; it also rewrites
      # the `catalog:` and `workspace:` specifiers into real ranges) and then
      # `changeset tag`. The action parses the "New tag:" output, pushes the
      # tags and creates the GitHub releases.
      #
      # `pnpm run`, NOT `vp run`: `vp run` does not propagate the
      # `ACTIONS_ID_TOKEN_REQUEST_URL` / `_TOKEN` variables the OIDC exchange
      # needs.
      #
      # Provenance: pnpm 11 takes settings like `provenance` only from
      # `pnpm_config_*` (an `NPM_CONFIG_PROVENANCE` would be ignored), and none
      # is set here. Left unset, pnpm attaches provenance by itself only when
      # the OIDC token reports a public repository AND the registry reports
      # the package as public, and skips it with a warning otherwise. Forcing
      # it on would make a publish from a private repository fail.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # the catalog) and renamed its inputs from v1's `version` / `publish` /
      # `commit` / `title`.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
