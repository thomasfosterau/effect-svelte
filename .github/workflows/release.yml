name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-svelte'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires manual approval via a protected GitHub Environment named
    # "release". See docs/RELEASING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    steps:
      - name: Checkout code
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm (on PATH, from `packageManager`) + Node + a frozen-lockfile install.
      - name: Setup toolchain
        uses: ./.github/actions/setup

      # npm Trusted Publishing (OIDC) requires npm >= 11.5. `changeset publish`
      # shells out to `pnpm publish`, which on pnpm 10 hands the upload to the
      # npm CLI, so upgrade it for the `id-token` below to be used instead of a
      # long-lived NPM_TOKEN.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release`, which builds and runs `changeset publish` —
      # `pnpm publish` per changed package, which also rewrites the `catalog:`
      # and `workspace:` specifiers into real ranges — authenticating via OIDC.
      #
      # `pnpm run`, NOT `vp run`: `vp run` does not propagate the
      # `ACTIONS_ID_TOKEN_REQUEST_URL` / `_TOKEN` variables npm needs for OIDC,
      # and npm then falls back to token auth and fails with ENEEDAUTH.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in the
      # catalog) and renamed its inputs from v1's `version` / `publish`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
