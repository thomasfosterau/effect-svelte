name: CI

# ONE required job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` task and every package's `check` /
# `test:unit` / `build`), not in GitHub Actions `needs:`. Shaped like the
# effect-web library's CI. Nothing here needs a database, a stage or a
# credential, so every PR runs the whole gate. The steps are AGENTS.md
# § Verification, in its order.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # pnpm + Node + a frozen-lockfile install; see the action's header.
      - uses: $/.github/actions/setup

      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      - name: Format and lint
        run: pnpm exec vp check

      # svelte-check over every package's src, tests and .svelte fixtures.
      - name: Type gate
        run: pnpm exec vp run check

      - name: Unit tests
        run: pnpm exec vp run -r test:unit

      - name: Build
        run: pnpm exec vp run -r build

      - name: Audit
        run: pnpm audit --audit-level high
