name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build

      # The example apps consume the built packages from dist/, so they run
      # after the package builds.
      - name: Typecheck examples
        run: vp run --filter "example-*" typecheck

      - name: Build examples
        run: vp run --filter "example-*" build
