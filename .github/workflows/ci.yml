name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm + Node + a frozen-lockfile install; see the action's header.
      - name: Setup toolchain
        uses: ./.github/actions/setup

      # Exactly one `svelte` and one `@sveltejs/kit` may resolve: a second copy
      # lets the compiler and the `svelte/internal` runtime disagree (#112).
      - name: Check single svelte and @sveltejs/kit
        run: |
          node -e '
            const lock = require("fs").readFileSync("pnpm-lock.yaml", "utf8");
            const versions = { svelte: new Set(), "@sveltejs/kit": new Set() };
            for (const [, name, version] of lock.matchAll(/^  \x27?(svelte|@sveltejs\/kit)@([^(\x27:]+)/gm))
              versions[name].add(version);
            for (const [name, set] of Object.entries(versions)) console.log(`${name}: ${[...set].join(", ")}`);
            if (Object.values(versions).some((set) => set.size !== 1)) {
              console.error("pnpm-lock.yaml must resolve exactly one svelte and one @sveltejs/kit (#112)");
              process.exit(1);
            }
          '

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build

      # The example apps consume the built packages from dist/, so they run
      # after the package builds.
      - name: Typecheck examples
        run: vp run --filter "example-*" typecheck

      - name: Build examples
        run: vp run --filter "example-*" build

      # Mount each example app in happy-dom (against dist/) and fail on an
      # uncaught error, a Svelte runtime error or a runaway effect (#136).
      - name: Smoke-test examples
        run: vp run --filter "example-*" smoke
