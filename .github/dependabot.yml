# Dependabot version-update configuration.
#
# The `npm` ecosystem at `/` reads the pnpm workspace, its catalogs and the
# lockfile. `groups` exist only for sets that MUST move together, so one PR
# moves a whole set and a set can never drift apart; every other dependency
# gets a PR of its own:
#
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton set
#   (`effect` + every `@effect/*`); the catalog pin and the `catalogs.peers`
#   floor move together (AGENTS.md § Effect). The `@effect/platform-node-shared`
#   entry in pnpm-workspace.yaml's `overrides` is a transitive pin Dependabot
#   cannot bump: move it by hand with this group (AGENTS.md § Common pitfalls).
# - `toolchain`: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries, and the `vitest` / `@vitest/*` catalog entries must
#   equal vite-plus's exact pin. (`@enfect/oxlint` is not in it: it takes
#   `@oxlint/plugins` at a caret range, so it runs on any oxlint vite-plus pins.)
# - `svelte`: the Svelte compiler, SvelteKit, the Vite plugin and svelte-check.
#
# Dependabot assigns a dependency to the FIRST group that matches, so the
# groups run specific → general.
#
# Hand moves Dependabot cannot make (AGENTS.md § Common pitfalls):
# - `vite` (`npm:@voidzero-dev/vite-plus-core@<v>`) and `typescript`
#   (`npm:@typescript/typescript6@<v>`) are npm aliases: on a `toolchain` PR
#   that bumps vite-plus, run `pnpm dlx --package=vite-plus@<v> vp migrate
#   --no-interactive` on its branch (it re-pins vite-plus, the `vite` alias and
#   the `vitest` pin together; drop the `minimumReleaseAgeExclude` entries it
#   adds and restore the bare `vite` / `vitest` override keys) and set `@vitest/coverage-istanbul` to the same vitest.
# - `overrides`-only pins (`@effect/platform-node-shared` with the `effect`
#   group; the security floors `undici`, `shell-quote`, `launch-editor`,
#   `source-map-js`) are raised or dropped by hand.
# - the `ghcr.io/voidzero-dev/vite-plus:<tag>` image in .devcontainer/devcontainer.json:
#   it equals the catalog's `vite-plus` pin, moved on the toolchain PR.
#
# `cooldown`: pnpm-workspace.yaml's `minimumReleaseAge` holds a new version for
# 8 hours, but Dependabot's cooldown only takes whole days, so it waits 1 day.
# That is longer than pnpm's hold, so a Dependabot PR never proposes a version
# pnpm would still refuse. `@thomasfosterau/*` is exempt in both.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # One release train and a runtime singleton.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        update-types: ["major", "minor", "patch"]
      # vite-plus pins vitest exactly; @vitest/* must equal it.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
        update-types: ["major", "minor", "patch"]
      # The compiler, Kit, the Vite plugin and the checkers that embed it.
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "svelte2tsx"
        update-types: ["major", "minor", "patch"]
    assignees:
      - thomasfosterau
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
  # The dev container's features (.devcontainer/devcontainer.json) and their
  # lockfile. The base image tag is not a feature: it is the catalog's
  # `vite-plus` pin, moved by hand on the toolchain PR.
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
