# Dependabot version-update configuration.
#
# The `npm` ecosystem at `/` reads the pnpm workspace, its catalogs and the
# lockfile. `groups` collect the sets that MUST move together, so one PR moves
# a whole set and a set can never drift apart:
#
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton set
#   (`effect` + every `@effect/*`); the catalog pin and the `catalogs.peers`
#   floor move together (AGENTS.md § Effect). The `@effect/platform-node-shared`
#   entry in pnpm-workspace.yaml's `overrides` is a transitive pin Dependabot
#   cannot bump: move it by hand with this group (AGENTS.md § Common pitfalls).
# - `toolchain`: vite-plus pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries, `vite` is vite-plus-core under an alias, the
#   `vitest` / `@vitest/*` catalog entries must equal vite-plus's exact pin,
#   the `typescript` alias (TS6) is what svelte-check and the declaration
#   emit drive, and the Effect lint preset (`@enfect/oxlint`) runs inside
#   that oxlint. `fallow` rides here too: it reads the coverage map Vitest
#   writes and gates agent commits.
# - `svelte`: the Svelte compiler, SvelteKit, the Vite plugin and svelte-check.
# - `happy-dom`, `changesets`: their own sets.
# - `minor-and-patch`: every remaining minor / patch update in one PR, so PR
#   volume stays low; a major outside the sets above stays its own PR.
#
# Dependabot assigns a dependency to the FIRST group that matches, so the
# groups run specific → general.
#
# Hand moves Dependabot cannot make (AGENTS.md § Common pitfalls):
# - `vite` (`npm:@voidzero-dev/vite-plus-core@<v>`) and `typescript`
#   (`npm:@typescript/typescript6@<v>`) are npm aliases: on a `toolchain` PR
#   that bumps vite-plus, run `pnpm dlx --package=vite-plus@<v> vp migrate
#   --no-interactive` on its branch (it re-pins vite-plus, the `vite` alias and
#   the `vitest` pin together; drop the `minimumReleaseAgeExclude` entries it
#   adds and restore the bare `vite` / `vitest` override keys) and set `@vitest/coverage-istanbul` to the same vitest.
# - `overrides`-only pins (`@effect/platform-node-shared` with the `effect`
#   group; the security floors `undici`, `shell-quote`, `launch-editor`,
#   `source-map-js`) are raised or dropped by hand.
#
# `cooldown`: pnpm-workspace.yaml's `minimumReleaseAge` holds a new version for
# 8 hours, but Dependabot's cooldown only takes whole days, so it waits 1 day.
# That is longer than pnpm's hold, so a Dependabot PR never proposes a version
# pnpm would still refuse. `@thomasfosterau/*` is exempt in both.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        update-types: ["major", "minor", "patch"]
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "typescript"
          - "@typescript/typescript6"
          - "@oxlint/*"
          - "@enfect/oxlint"
          - "fallow"
        update-types: ["major", "minor", "patch"]
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "svelte2tsx"
        update-types: ["major", "minor", "patch"]
      happy-dom:
        applies-to: version-updates
        patterns:
          - "happy-dom"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
