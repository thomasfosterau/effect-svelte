# zizmor configuration (`uvx zizmor --offline .github`).
rules:
  dependabot-cooldown:
    config:
      # The owner's policy: pnpm's `minimumReleaseAge` is 8 hours and
      # Dependabot waits the smallest whole number of days above it
      # (dependabot.yml header), not zizmor's default of 7.
      days: 1
