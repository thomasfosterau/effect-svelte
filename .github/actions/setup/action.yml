# Composite setup shared by every workflow that needs the toolchain: Vite+
# (`vp`, at the catalog's `vite-plus` pin), the Node.js and pnpm it manages,
# the pnpm store cache (keyed on pnpm-lock.yaml) and a frozen-lockfile install
# (retried — see the Install step's own comment). setup-vp puts `vp`, `node`
# and `pnpm` on PATH itself, so later steps call `vp` directly.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first, and setup-vp reads the Vite+ and pnpm versions
# from it).
name: Setup toolchain
description: Set up Vite+ with its managed Node.js and pnpm, restore the package cache and install dependencies against the lockfile.
inputs:
  node-version:
    # CI tests one Node version, the latest stable release (#114). `*` is a
    # semver range, and a range never matches a pre-release: `latest` would
    # take whatever heads nodejs.org's dist index, and on 2026-10-29 that
    # became `v27.0.0-alpha.0.0.0`, on which file responses hang (#214).
    description: The Node.js version (a semver range) to set up.
    required: false
    default: "*"
runs:
  using: composite
  steps:
    # Vite+ at the version the catalog pins (`vite-plus: "catalog:"` in
    # package.json, resolved through pnpm-workspace.yaml), then Node.js through
    # `vp env use` and pnpm at package.json's `packageManager`. The install is
    # the next step, so it can be retried.
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0 # zizmor: ignore[unpinned-uses] an exact release tag, as setup-vp's README asks; the Actions lockfile (#250) pins its commit
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
        run-install: false

    - name: Show the toolchain
      shell: bash
      run: |
        vp --version
        node --version
        pnpm --version

    # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with the
    # manifests or the catalog in pnpm-workspace.yaml. Retried: pnpm's linker
    # can race itself on a cold store (a transient ENOENT renaming a
    # `_tmp_<pid>_<hex>` staging directory, seen in the family's other repos);
    # every attempt keeps `--frozen-lockfile`, so a deterministic failure
    # (lockfile drift, a policy violation) still fails all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if vp install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::vp install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::vp install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
