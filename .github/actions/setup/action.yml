# Composite setup shared by every workflow that needs the toolchain: pnpm +
# Node.js, the pnpm store cache (keyed on pnpm-lock.yaml by setup-node), and a
# frozen-lockfile install. `vp` and the dev bins land in node_modules/.bin,
# which this adds to PATH so later steps invoke `vp …` directly. Copied in
# shape from effect-jsonapi / effect-drizzle-ext (the library reference).
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache and install dependencies against the lockfile.
inputs:
  node-version:
    description: The Node.js version to set up.
    required: false
    default: 22.x
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with the
    # manifests or the catalog in pnpm-workspace.yaml.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Expose the local bins
      shell: bash
      run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
