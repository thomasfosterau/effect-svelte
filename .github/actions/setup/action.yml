# Composite setup shared by every workflow that needs the toolchain: pnpm +
# Node.js, the pnpm store cache (keyed on pnpm-lock.yaml by setup-node), and a
# frozen-lockfile install (retried — see the Install step's own comment).
# `vp`, `fallow` and the other dev bins land in node_modules/.bin; later steps
# call them through `pnpm exec` rather than adding that directory to
# `GITHUB_PATH` (a write to an environment file zizmor flags as `github-env`).
# Copied in shape from the effect-web library's action.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache and install dependencies against the lockfile.
inputs:
  node-version:
    # CI tests one Node version, the latest stable release (#114). Not
    # `latest`: setup-node resolves that to the first entry of nodejs.org's
    # dist index, whatever it is, and on 2026-10-29 that became
    # `v27.0.0-alpha.0.0.0`, a pre-release on which file responses hang.
    # `*` with `check-latest` resolves against actions/node-versions'
    # manifest of stable releases instead, so a new major arrives once it
    # ships stable.
    description: The Node.js version (a semver range) to set up.
    required: false
    default: "*"
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: true
        cache: pnpm

    # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with the
    # manifests or the catalog in pnpm-workspace.yaml. Retried: pnpm's linker
    # can race itself on a cold store (a transient ENOENT renaming a
    # `_tmp_<pid>_<hex>` staging directory, seen in the family's other repos);
    # every attempt keeps `--frozen-lockfile`, so a deterministic failure
    # (lockfile drift, a policy violation) still fails all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
